# Besu Node 2 Configuration - Validator
data-path="data/node2"
genesis-file="config/genesis.json"

# Network settings
p2p-enabled=true
p2p-host="127.0.0.1"
p2p-port=30304

# RPC settings
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8546
rpc-http-cors-origins=["*"]
rpc-http-api=["ETH","NET","WEB3","ADMIN","IBFT","TXPOOL"]

# Mining/Validator settings
miner-enabled=true
miner-coinbase="0x70997970c51812dc3a010c7d01b50e0d17dc79c8"

# Zero gas price configuration (FREE TRANSACTIONS)
min-gas-price=0
tx-pool-price-bump=0

# Logging
logging="INFO"

# Bootnodes (reference node1)
# bootnodes=["enode://...@127.0.0.1:30303"]
