name: Deploy to bhoomichain.centralindia.cloudapp.azure.com

on:
  push:
    branches: [main, jash]
  workflow_dispatch:

jobs:
  deploy-to-azure-vm:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy application locally on the self-hosted runner
        run: |
          set -e  # Exit on error

          echo "==> Starting deployment on self-hosted runner..."
          USER_HOME=$(eval echo ~$USER)
          APP_DIR="$USER_HOME/BharatRegistry"

          # ==================== APPLICATION SETUP ====================
          echo "==> Copying deployment files to $APP_DIR..."
          mkdir -p "$APP_DIR"
          
          # Rsync from GitHub actions workspace to the actual app directory
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='coverage' --exclude='besu-network/data*' --exclude='besu-network/logs*' --exclude='artifacts' --exclude='cache' ./ "$APP_DIR/"

          # ==================== BLOCKCHAIN NETWORK ====================
          echo "==> Checking Besu Network Status..."
          if ! pm2 describe "besu-node1" > /dev/null 2>&1; then
              echo "==> Starting Besu Network via PM2..."
              cd "$APP_DIR/besu-network"
              chmod +x start-network.sh || true
              pm2 start "besu --config-file=config/node1.toml" --name "besu-node1" --cwd "$APP_DIR/besu-network"
              sleep 3
              
              ENODE=$(curl -s -X POST --data '{"jsonrpc":"2.0","method":"admin_nodeInfo","params":[],"id":1}' http://127.0.0.1:8545 | jq -r '.result.enode')
              if [ -n "$ENODE" ]; then
                  sed -i "s|# bootnodes=\[\]|bootnodes=[\"$ENODE\"]|g" config/node2.toml
                  sed -i "s|# bootnodes=\[\"enode://...\@127.0.0.1:30303\"\]|bootnodes=[\"$ENODE\"]|g" config/node2.toml
                  sed -i "s|# bootnodes=\[\"enode://...\@127.0.0.1:30303\"\]|bootnodes=[\"$ENODE\"]|g" config/node3.toml
                  pm2 start "besu --config-file=config/node2.toml" --name "besu-node2" --cwd "$APP_DIR/besu-network"
                  pm2 start "besu --config-file=config/node3.toml" --name "besu-node3" --cwd "$APP_DIR/besu-network"
              fi
          fi

          # ==================== BACKEND SETUP ====================
          echo "==> Setting up backend..."
          cd "$APP_DIR/backend"

          if [ ! -f .env ]; then
              echo "ERROR: backend/.env file is missing in $APP_DIR/backend/ !" >&2
              exit 1
          fi

          npm install
          
          pm2 describe bharat-backend > /dev/null 2>&1
          if [ $? -eq 0 ]; then
              pm2 restart bharat-backend --update-env
          else
              pm2 start src/app.js --name bharat-backend --update-env
          fi

          # ==================== FRONTEND SETUP ====================
          echo "==> Setting up frontend..."
          cd "$APP_DIR/frontend"

          if [ ! -f .env ]; then
              echo "ERROR: frontend/.env file is missing in $APP_DIR/frontend/ !" >&2
              exit 1
          fi

          npm install
          echo "==> Building frontend..."
          npm run build
          
          pm2 describe bharat-frontend > /dev/null 2>&1
          if [ $? -eq 0 ]; then
              pm2 restart bharat-frontend --update-env
          else
              pm2 serve dist 5173 --name bharat-frontend --spa --update-env
          fi

          # Save PM2 state
          pm2 save

          echo "======================================"
          echo "✓ Deployment Script Complete!"
          echo "======================================"
